<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTFALL — Lab</title>
<style>
:root{color-scheme:dark;--bg:#101417;--panel:#181f21;--line:#303b3b;--ink:#edf1e9;--muted:#a5b3aa;--lime:#c1ec87;--amber:#f2c282}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Segoe UI',sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:3px}.top{border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:20px 5vw}.brand{letter-spacing:.18em;font-weight:750}.brand span{color:var(--lime)}.labtag,.eyebrow{font:11px Consolas,monospace;letter-spacing:.13em;color:var(--lime)}.locale{display:flex;gap:5px}.locale button{background:transparent;color:var(--muted);border:1px solid var(--line);padding:8px 12px}.locale button[aria-pressed=true]{color:var(--bg);background:var(--lime);border-color:var(--lime)}main{max-width:1340px;margin:auto;padding:36px 5vw 60px}.notice{padding:14px 18px;background:#28291f;color:#e6d4ae;border:1px solid #524b37;font-size:13px}.header{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:45px 0 34px}h1{font-size:clamp(32px,4.2vw,53px);line-height:1.08;letter-spacing:-.04em;margin:12px 0}h1 span{color:var(--lime)}.subtitle{color:var(--muted);max-width:680px;margin:0}.run{border:0;background:var(--lime);color:#172014;font-weight:700;padding:15px 22px;min-width:196px}.run:disabled{opacity:.6}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:18px}.panel{background:var(--panel);border:1px solid var(--line);padding:24px}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding-bottom:18px}.panel h2{margin:4px 0 0;font-size:19px}.badge{color:var(--amber);font:11px Consolas,monospace;border:1px solid #67593f;padding:6px 8px;white-space:nowrap}.state{padding:28px 0 18px;min-height:125px}.state h3{font-size:24px;margin:0 0 8px}.state p{color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.metric{padding:18px 8px 4px 0}.metric b{display:block;font:26px Consolas,monospace;color:var(--lime)}.metric span{font-size:12px;color:var(--muted)}.side h3{font-size:15px;margin:24px 0 6px}.side p{color:var(--muted);margin:0;font-size:13px}.side h3:first-of-type{margin-top:24px}.side hr{border:0;border-top:1px solid var(--line);margin:22px 0}.disabled{color:var(--amber);font:11px Consolas,monospace;letter-spacing:.09em}.footer{display:flex;justify-content:space-between;gap:20px;color:#82928a;font:11px Consolas,monospace;margin-top:25px}@media(max-width:760px){.header{display:block}.run{margin-top:20px}.layout{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.footer{display:block}.top{padding:18px 5vw}}
</style></head><body><header class="top"><div class="brand"><span>◈</span> NIGHTFALL <span class="labtag"> / LAB</span></div><nav class="locale" aria-label="Language"><button id="fr" aria-pressed="true">FR</button><button id="en" aria-pressed="false">EN</button></nav></header><main>
<div class="notice" data-i="notice"></div><div class="header"><div><div class="eyebrow" data-i="eyebrow"></div><h1 data-i="title"></h1><p class="subtitle" data-i="subtitle"></p></div><button class="run" id="run" data-i="run"></button></div>
<div class="layout"><section class="panel"><div class="panelhead"><div><div class="eyebrow" data-i="obsLabel"></div><h2 data-i="obsTitle"></h2></div><span class="badge" data-i="badge"></span></div><div class="state" aria-live="polite"><h3 id="stateTitle"></h3><p id="stateDesc"></p></div><div class="metrics"><div class="metric"><b id="count">—</b><span data-i="cookies"></span></div><div class="metric"><b id="secure">—</b><span data-i="secure"></span></div><div class="metric"><b id="http">—</b><span data-i="http"></span></div><div class="metric"><b id="same">—</b><span data-i="same"></span></div></div></section>
<aside class="panel side"><div class="eyebrow" data-i="scope"></div><h2 data-i="scopeTitle"></h2><h3 data-i="fixtureTitle"></h3><p data-i="fixture"></p><h3 data-i="peerTitle"></h3><p data-i="peer"></p><hr><div class="disabled" data-i="disabled"></div><h3 data-i="prodTitle"></h3><p data-i="prod"></p></aside></div><div class="footer"><span data-i="footer1"></span><span data-i="footer2"></span></div></main>
<script nonce="__NONCE__">
'use strict';
const capability='__CAPABILITY__';
const copy={fr:{notice:'LABORATOIRE LOCAL · Prototype distinct de l’interface publique. Aucune cible externe ni audit réel.',eyebrow:'DIGITAL FORTRESS / ENVIRONNEMENT ISOLÉ',title:'Observer, sans sortir du labo.',subtitle:'Une démonstration NIGHTFALL inspirée du produit, reliée uniquement à une fixture locale synthétique.',run:'Lancer l’observation →',obsLabel:'01 / OBSERVATION LIVE',obsTitle:'Attributs des cookies',badge:'FIXTURE SYNTHÉTIQUE',scope:'02 / PÉRIMÈTRE',scopeTitle:'Ce que montre ce prototype',fixtureTitle:'Une requête locale contrôlée',fixture:'Le bouton déclenche une observation réelle sur une fixture appartenant au laboratoire. Les noms et valeurs des cookies ne sont pas affichés.',peerTitle:'Pair et DNS simulés',peer:'Le pair public et la résolution DNS sont simulés. Le socket réel se connecte uniquement à la boucle locale.',disabled:'● AUDIT DE PRODUCTION DÉSACTIVÉ',prodTitle:'Pas un audit externe',prod:'Cette page est une démonstration séparée, pas l’interface publique ni une preuve de protection réseau en production.',footer1:'NIGHTFALL LAB / PROTOTYPE LOCAL',footer2:'AUCUNE CIBLE CONFIGURABLE',cookies:'Cookies observés',secure:'Sans Secure',http:'Sans HttpOnly',same:'Sans SameSite',idleTitle:'En attente d’observation',idleDesc:'Lancez la fixture pour afficher les faits observés.',loadingTitle:'Observation en cours…',loadingDesc:'Connexion à la fixture locale uniquement.',okTitle:'Observation terminée',okDesc:'Comptages issus de la réponse synthétique locale. Résultat limité, non extrapolable.',errorTitle:'Observation indisponible',errorDesc:'Aucun résultat n’a été conservé. Réessayez dans le laboratoire.'},en:{notice:'LOCAL LAB · Separate prototype, not the public interface. No external target or real audit.',eyebrow:'DIGITAL FORTRESS / ISOLATED ENVIRONMENT',title:'Observe, without leaving the lab.',subtitle:'A NIGHTFALL-inspired product demonstration connected only to an owned synthetic local fixture.',run:'Run observation →',obsLabel:'01 / LIVE OBSERVATION',obsTitle:'Cookie attributes',badge:'SYNTHETIC FIXTURE',scope:'02 / SCOPE',scopeTitle:'What this prototype shows',fixtureTitle:'One controlled local request',fixture:'The button triggers a real observation against a lab-owned fixture. Cookie names and values are not displayed.',peerTitle:'Simulated peer and DNS',peer:'The public peer and DNS resolution are simulated. The real socket connects only to loopback.',disabled:'● PRODUCTION AUDIT DISABLED',prodTitle:'Not an external audit',prod:'This is a separate demonstration, not the public interface or proof of production network protections.',footer1:'NIGHTFALL LAB / LOCAL PROTOTYPE',footer2:'NO CONFIGURABLE TARGET',cookies:'Cookies observed',secure:'Missing Secure',http:'Missing HttpOnly',same:'Missing SameSite',idleTitle:'Awaiting observation',idleDesc:'Run the fixture to display observed facts.',loadingTitle:'Observing…',loadingDesc:'Connecting only to the local fixture.',okTitle:'Observation complete',okDesc:'Counts come from the local synthetic response. Limited result; not generalizable.',errorTitle:'Observation unavailable',errorDesc:'No result was retained. Try again in the lab.'}};
let locale='fr', state='idle'; const ids=['count','secure','http','same'];
function render(){const t=copy[locale];document.documentElement.lang=locale;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[el.dataset.i]);document.getElementById('stateTitle').textContent=t[state+'Title'];document.getElementById('stateDesc').textContent=t[state+'Desc'];for(const l of ['fr','en'])document.getElementById(l).setAttribute('aria-pressed',String(l===locale));}
for(const l of ['fr','en'])document.getElementById(l).addEventListener('click',()=>{locale=l;render()});
document.getElementById('run').addEventListener('click',async()=>{const button=document.getElementById('run');button.disabled=true;state='loading';ids.forEach(id=>document.getElementById(id).textContent='—');render();try{const response=await fetch('/lab/observation',{method:'POST',headers:{'X-Fortress-Capability':capability},credentials:'omit',redirect:'error',cache:'no-store'});if(!response.ok)throw Error('unavailable');const data=await response.json();const c=data.observation?.cookies;const fields=['count','missing_secure','missing_httponly','missing_samesite'];if(data.mode!=='synthetic-owned-loopback'||data.observation?.outcome!=='ok'||data.fixture?.actual_peer_loopback!==true||data.fixture?.requests!==1||!c||!fields.every(k=>Number.isSafeInteger(c[k])&&c[k]>=0&&c[k]<=100))throw Error('invalid');fields.forEach((key,i)=>document.getElementById(ids[i]).textContent=String(c[key]));state='ok'}catch(_){state='error'}finally{button.disabled=false;render()}});render();
</script></body></html>

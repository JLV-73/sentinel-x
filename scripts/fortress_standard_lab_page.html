<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>NIGHTFALL — laboratoire standard</title><style>body{background:#101422;color:#e6edf7;font:16px system-ui;max-width:900px;margin:auto;padding:2rem}button,select{font:inherit;padding:.6rem}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #59677d;padding:.6rem;text-align:left}.notice{border-left:4px solid #f3c368;padding:1rem;background:#202639}@media print{body{background:white;color:black}button,select,label{display:none}}</style></head><body data-capability="__CAPABILITY__"><h1>NIGHTFALL · STANDARD LAB</h1><p class="notice" id="notice"></p><label for="lang">Language / Langue</label> <select id="lang"><option value="fr">Français</option><option value="en">English</option></select> <label for="scenario" id="choose"></label> <select id="scenario"><option value="positive">Positive</option><option value="negative">Negative</option><option value="indeterminate">Indeterminate</option></select> <button id="run"></button> <button id="print"></button><p id="message" role="status" aria-live="polite"></p><section id="report" aria-live="polite"></section><script nonce="__NONCE__">
const text={fr:{notice:'Laboratoire synthétique uniquement. DNS et pair public simulés ; aucune validation opérationnelle, aucun site externe. Routes masquées.',choose:'Scénario',run:'Exécuter le test',print:'Imprimer',summary:'Rapport local · données synthétiques',check:'Contrôle',status:'Statut',attention:'Attention',indeterminate:'Indéterminé',conformant:'Conforme',limits:'Prototype incomplet : les contrôles non réalisés restent indéterminés. La présence d’un en-tête ne prouve pas son efficacité.',failed:'Test indisponible.'},en:{notice:'Synthetic lab only. DNS and public peer are simulated; no production validation or external site. Paths redacted.',choose:'Scenario',run:'Run test',print:'Print',summary:'Local report · synthetic data',check:'Check',status:'Status',attention:'Attention',indeterminate:'Indeterminate',conformant:'Conformant',limits:'Incomplete prototype: unperformed checks remain indeterminate. A present header does not prove effectiveness.',failed:'Test unavailable.'}};
const printButton=document.getElementById('print'); printButton.onclick=()=>window.print();
const recommendations={fr:{https_tls:'Évaluer TLS et le certificat dans un cadre autorisé.',hsts:'Après validation HTTPS, envisager HSTS et sa durée.',csp:'Définir et tester une CSP adaptée.',x_content_type_options:'Envisager X-Content-Type-Options: nosniff et vérifier les types MIME.',referrer_policy:'Choisir une Referrer-Policy adaptée.',permissions_policy:'Restreindre les fonctionnalités par une Permissions-Policy adaptée.',cookie_attributes:'Examiner Secure, HttpOnly et SameSite selon l’usage ; utiliser HTTPS.'},en:{https_tls:'Assess TLS and certificate in an authorized scope.',hsts:'After validating HTTPS, consider HSTS and its duration.',csp:'Define and test an appropriate CSP.',x_content_type_options:'Consider X-Content-Type-Options: nosniff and verify MIME types.',referrer_policy:'Choose an appropriate Referrer-Policy.',permissions_policy:'Restrict features using an appropriate Permissions-Policy.',cookie_attributes:'Review Secure, HttpOnly and SameSite according to usage; use HTTPS.'}};
const details={fr:{sourceLabel:'Source : service interne, projection de laboratoire et réponse HTTP synthétique contrôlée ; GET, route masquée.',limit:'Pair public et DNS simulés ; connexions réelles uniquement en loopback. API de production indisponible (503), aucun audit de production ni TLS public vérifié. Applicabilité et sécurité globale non établies.',code:'Code de preuve',severity:'Sévérité rapportée',recommendation:'Recommandation',attention:'Absence observée dans la réponse synthétique, sans exploitation.',missing:'Au moins un attribut recommandé manque sur le cookie synthétique ; la preuve ne précise pas lequel.',present:'Secure, HttpOnly et SameSite observés sur le cookie synthétique examiné ; applicabilité non déterminée.',unknown:'Preuve insuffisante ; ne pas conclure à la conformité.',fallback:'Si pertinent, examiner ce contrôle avec des preuves adaptées dans un cadre autorisé.',execution:'Exécution de la route',states:{completed:'terminée',blocked:'bloquée',indeterminate:'indéterminée',redirected:'redirigée',not_started:'non commencée'}},en:{sourceLabel:'Source: internal service, lab projection and controlled synthetic HTTP response; GET, redacted route.',limit:'Public peer and DNS simulated; actual connections loopback only. Production API unavailable (503); no production audit or public TLS verification. Applicability and overall safety not established.',code:'Evidence code',severity:'Reported severity',recommendation:'Recommendation',attention:'Absence observed in the synthetic response, without exploitation.',missing:'At least one recommended attribute is missing from the synthetic cookie; the evidence does not identify which.',present:'Secure, HttpOnly and SameSite observed on the examined synthetic cookie; applicability not determined.',unknown:'Insufficient evidence; do not infer compliance.',fallback:'Where relevant, review this check using appropriate evidence in an authorized scope.',execution:'Route execution',states:{completed:'completed',blocked:'blocked',indeterminate:'indeterminate',redirected:'redirected',not_started:'not started'}}};
let result=null;function render(){let t=text[lang.value],d=details[lang.value];document.documentElement.lang=lang.value;notice.textContent=t.notice;choose.textContent=t.choose;run.textContent=t.run;printButton.textContent=t.print;report.replaceChildren();if(!result)return;function add(parent,tag,value){let x=document.createElement(tag);x.textContent=value;parent.append(x);return x}add(report,'h2',t.summary);add(report,'p',t.limits+' '+d.limit);add(report,'p',d.sourceLabel);for(let r of result.route_execution||[])add(report,'p',d.execution+': '+(d.states[r.state]||d.states.indeterminate));for(let f of result.findings){let a=add(report,'section','');let positive=f.id==='cookie_attributes'&&f.status==='conformant'&&f.severity==='info'&&f.evidence_code==='cookie_attributes_present';let missing=f.id==='cookie_attributes'&&f.status==='attention'&&f.severity==='low'&&f.evidence_code==='cookie_attributes_missing';let attention=['hsts','csp','x_content_type_options','referrer_policy','permissions_policy'].includes(f.id)&&f.status==='attention'&&f.severity==='low'&&f.evidence_code==='header_absent';let status=positive?'conformant':missing||attention?'attention':'indeterminate';add(a,'h3',f.id);add(a,'p',t.status+': '+t[status]+' · '+d.severity+': '+(status==='indeterminate'?'unknown':f.severity));add(a,'p',d.code+': '+(positive||missing||attention?f.evidence_code:'unknown')+' · '+(['GET','HEAD','OPTIONS'].includes(f.method)?f.method:'unknown')+' · [redacted route]');add(a,'p',positive?d.present:missing?d.missing:attention?d.attention:d.unknown);add(a,'p',d.recommendation+': '+(recommendations[lang.value][f.id]||d.fallback))}}lang.onchange=render;run.onclick=async()=>{message.textContent='…';result=null;render();try{let r=await fetch('/lab/audit',{method:'POST',headers:{'Content-Type':'application/json','X-Fortress-Capability':document.body.dataset.capability,'X-Fortress-CSRF':'same-origin'},body:JSON.stringify({scenario:scenario.value})});if(!r.ok)throw Error();result=await r.json();message.textContent='';render()}catch{message.textContent=text[lang.value].failed}};render();
</script></body></html>

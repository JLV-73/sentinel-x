let result=null, generation=0;
const consent=document.getElementById('consent'), exportButton=document.getElementById('export');
const known=['https_tls','hsts','csp','x_content_type_options','referrer_policy','permissions_policy','cookie_attributes','third_party_scripts','version','debug_info','directory_index','cors','redirect','reflection'];
function clearResult(){generation++;result=null;message.textContent='';render()}
function render(){
 const t=text[lang.value],d=details[lang.value],fr=lang.value==='fr';
 document.documentElement.lang=lang.value;notice.textContent=t.notice;choose.textContent=t.choose;run.textContent=t.run;printButton.textContent=t.print;

 exportButton.textContent=fr?'Exporter le rapport HTML':'Export HTML report';run.disabled=!consent.checked;printButton.disabled=!result;exportButton.disabled=!result;report.replaceChildren();if(!result)return;

 add(report,'h2',t.summary);let intro=add(report,'div','');intro.className='summary-card';add(intro,'h3',fr?'01 · Synthèse':'01 · Executive summary');add(intro,'p',fr?'Constats limités à la fixture et aux contrôles attribués. Aucun verdict global de sécurité.':'Findings are limited to this fixture and their assigned checks. No overall security verdict.');let metrics=add(intro,'div','');metrics.className='metrics';let counts={attention:0,conformant:0,indeterminate:0};

  let positive=valid&&completed&&id==='cookie_attributes'&&f.status==='conformant'&&f.severity==='info'&&f.evidence_code==='cookie_attributes_present';
  let missing=valid&&completed&&id==='cookie_attributes'&&f.status==='attention'&&f.severity==='low'&&f.evidence_code==='cookie_attributes_missing';
  let attention=valid&&completed&&['hsts','csp','x_content_type_options','referrer_policy','permissions_policy'].includes(id)&&f.status==='attention'&&f.severity==='low'&&['header_absent','header_invalid'].includes(f.evidence_code);

  let syntax=valid&&completed&&['hsts','csp','referrer_policy','permissions_policy'].includes(id)&&f.status==='indeterminate'&&f.severity==='unknown'&&f.evidence_code==='header_syntax_recognized';
  let status=positive||tls||headerValid?'conformant':missing||attention?'attention':'indeterminate';counts[status]++;
    let a=add(report,'section','');let box=add(a,'details','');box.open=true;let sum=add(box,'summary',t[status]);add(sum,'h3',id);add(box,'p',t.status+': '+t[status]+' · '+d.severity+': '+(status==='indeterminate'?'unknown':f.severity));add(box,'p',d.code+': '+(positive||tls||missing||attention||headerValid||syntax?f.evidence_code:'unknown')+' · '+(valid?'GET':'unknown')+' · [redacted route]');add(box,'p',tls?(fr?'Certificat et nom d’hôte validés contre la CA du laboratoire pour cette fixture uniquement ; aucune preuve TLS Internet ni verdict de sécurité globale.':'Certificate and hostname validated against the lab CA for this fixture only; no Internet TLS proof or overall security verdict.'):positive?d.present:missing?d.missing:headerValid?(fr?'Catégorie nosniff reconnue ; efficacité globale non établie.':'Recognized nosniff category; overall effectiveness not established.'):syntax?(fr?'Syntaxe limitée reconnue ; efficacité non établie.':'Limited syntax recognized; effectiveness not established.'):attention&&f.evidence_code==='header_invalid'?(fr?'Valeur vide ou catégorie invalide observée.':'Empty value or invalid category observed.'):attention?d.attention:d.unknown);add(box,'p',d.recommendation+': '+(recommendations[lang.value][id]||d.fallback));
 }
 for(const key of ['attention','conformant','indeterminate']){let m=add(metrics,'div','');m.className='metric';add(m,'strong',String(counts[key]));add(m,'span',t[key])}
 let foot=add(report,'div','');foot.className='summary-card';add(foot,'h3',fr?'02 · Sources et limites':'02 · Sources and limitations');add(foot,'p',t.limits+' '+d.limit);add(foot,'p',d.sourceLabel);add(foot,'p',d.execution+': '+(executionValid?d.states[result.route_execution[0].state]:d.states.indeterminate));
 let http=executionValid&&Number.isInteger(result.http_status)&&result.http_status>=100&&result.http_status<=599?String(result.http_status):(fr?'non observé':'not observed');
 add(foot,'p',(fr?'Statut HTTP observé : ':'Observed HTTP status: ')+http);
 if(executionValid&&result.route_execution[0].state==='redirected')add(foot,'p',fr?'Redirection observée, non suivie ; destination masquée.':'Redirect observed, not followed; destination redacted.');
 if(executionValid&&Number.isInteger(result.http_status)&&result.http_status>=400&&result.http_status<=599)add(foot,'p',fr?'Réponse HTTP de refus observée ; aucune conformité déduite.':'HTTP refusal observed; no compliance inferred.');

}

run.onclick=async()=>{if(!consent.checked)return;clearResult();let current=generation, selected=scenario.value;message.textContent='…';try{let r=await fetch('/lab/audit',{method:'POST',headers:{'Content-Type':'application/json','X-Fortress-Capability':document.body.dataset.capability,'X-Fortress-CSRF':'same-origin'},body:JSON.stringify({scenario:selected,route_authorized:true})});if(!r.ok)throw Error();let data=await r.json();if(current!==generation||!consent.checked||selected!==scenario.value)return;result=data;message.textContent='';render()}catch{if(current===generation)message.textContent=text[lang.value].failed}};

</script></body></html>
